<body data-tool="gitignore-gen">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Gitignore Gen</h1>
    <p>Pick your languages, frameworks, editors and operating systems and get one clean <code>.gitignore</code>: merged, deduplicated and commented.</p>
  </section>

  <div class="grid-2 gi-grid">
    <section class="card stack">
      <div class="row between">
        <h2>Templates <small id="count"></small></h2>
        <button class="btn ghost small" id="none">Clear selection</button>
      </div>
      <label class="field"><span class="sr">Search templates</span>
        <input class="input" id="search" type="search" placeholder="Search: node, python, unity, mac…" autocomplete="off">
      </label>
      <div class="gi-chips" id="chips" role="group" aria-label="Templates"></div>
      <div class="row gi-presets">
        <span class="faint">Quick picks:</span>
        <button class="btn small" data-preset="node,nextjs,vscode,macos,windows">Next.js app</button>
        <button class="btn small" data-preset="python,django,vscode,jetbrains,linux">Django</button>
        <button class="btn small" data-preset="flutter,android,ios,vscode,macos">Flutter</button>
        <button class="btn small" data-preset="unity,vscode,windows,macos">Unity game</button>
      </div>
      <label class="field">Your own lines (added at the end)
        <textarea class="textarea gi-custom" id="custom" spellcheck="false" placeholder="secrets/&#10;*.local.json&#10;!keep-me.log"></textarea>
      </label>
      <div class="row">
        <label class="check"><input type="checkbox" id="headers" checked> Section headers</label>
        <label class="check"><input type="checkbox" id="dedupe" checked> Remove duplicate lines</label>
      </div>
    </section>

    <section class="card stack">
      <div class="row between">
        <h2>.gitignore <small id="info"></small></h2>
        <div class="row">
          <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
          <button class="btn small primary" id="save"><svg class="i"><use href="#i-download"/></svg>.gitignore</button>
        </div>
      </div>
      <pre class="out gi-out" id="out" tabindex="0"></pre>
    </section>
  </div>
</main>
<script src="app.js"></script>
